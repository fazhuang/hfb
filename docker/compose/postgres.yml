# ============================================================
# Docker Compose — Service Modules (for docker/compose/)
# ============================================================
# These are service definitions that can be included by
# docker-compose.dev.yml and docker-compose.prod.yml
# ============================================================

# PostgreSQL service template
# Include in dev/prod compose files with: docker compose -f docker-compose.yml -f docker/compose/postgres.yml up
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hfb}
      POSTGRES_USER: ${POSTGRES_USER:-hfb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hfb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hfb} -d ${POSTGRES_DB:-hfb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hfb-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  hfb-network:
    external: true
