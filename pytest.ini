[pytest]
# pytest.ini — extends pyproject.toml [tool.pytest.ini_options]

# Default: skip real_llm tests to avoid unintended API costs
addopts =
    --strict-markers
    --strict-config
    -m "not real_llm"

# Exclude scripts/ from collection (manual e2e/utility scripts are not unit tests)
norecursedirs = scripts .git .venv node_modules

# Filter warnings
filterwarnings =
    error
    ignore::DeprecationWarning:alembic.*
    ignore::DeprecationWarning:pydantic.*
    ignore::ResourceWarning
    ignore::pytest.PytestUnhandledThreadExceptionWarning

markers =
    unit: unit tests
    integration: integration tests (require services)
    e2e: end-to-end tests
    slow: tests that take >1s
    real_llm: tests requiring a configured real LLM provider
