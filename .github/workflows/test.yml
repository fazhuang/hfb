name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
      fail-fast: false

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hfb_test
          POSTGRES_USER: hfb
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short
        env:
          TESTING: 1
          POSTGRES_HOST: localhost
          POSTGRES_DB: hfb_test
          POSTGRES_USER: hfb
          POSTGRES_PASSWORD: test_password

      - name: Install Chromium for browser E2E
        run: pip install playwright && python -m playwright install chromium --with-deps
        continue-on-error: true

      - name: Install frontend dependencies
        run: |
          npm install -g pnpm@10
          pnpm install --dir apps/frontend --frozen-lockfile

      - name: Run browser E2E isolation tests
        run: |
          playwright install chromium --with-deps
          pytest tests/e2e/test_critical_journeys.py::TestCrossProjectIsolation \
            -v --browser chromium --tracing=retain-on-failure \
            -o "screenshot_dir=/tmp/e2e-screenshots"
        env:
          TESTING: 1
        continue-on-error: true
        timeout-minutes: 10

      - name: Generate coverage report
        run: pytest --cov --cov-report=xml --cov-report=html
        env:
          TESTING: 1
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: python
        continue-on-error: true

      - name: Upload python test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-test-artifacts
          path: |
            coverage.xml
            htmlcov/
          retention-days: 90
        continue-on-error: true

  node-test:
    name: Node Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/cobertura-coverage.xml
          flags: node
        continue-on-error: true

      - name: Upload node test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-test-artifacts
          path: |
            apps/frontend/coverage/
            coverage/
          retention-days: 90
        continue-on-error: true
