name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python (Ruff + Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Install project + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check (Phase A0 publish path — strict, blocking)
        run: |
          mypy --strict \
            apps/backend/app/api/v1/extractions.py \
            apps/backend/app/api/v1/source_admissions.py \
            apps/backend/app/services/candidate_extraction_service.py \
            apps/backend/app/services/candidate_generation.py \
            apps/backend/app/services/citation_persistence.py \
            apps/backend/app/db/candidate_publish_uow.py \
            apps/backend/app/db/candidate_create_uow.py \
            apps/backend/app/db/grounding.py \
            apps/backend/app/db/database.py \
            apps/backend/app/db/audit_triggers.py \
            apps/backend/app/db/base.py \
            apps/backend/app/models/candidate_extraction.py \
            apps/backend/app/models/candidate_audit_log.py \
            apps/backend/app/models/metadata.py \
            apps/backend/app/models/source_admission.py \
            apps/backend/app/schemas/candidate.py \
            apps/backend/app/schemas/source_admission.py \
            apps/backend/app/repositories/candidate_extraction.py \
            apps/backend/app/repositories/source_admission.py \
            apps/backend/app/repositories/source_ref.py \
            apps/backend/app/repositories/version.py \
            apps/backend/app/repositories/user.py

  node-lint:
    name: Node (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Prettier check
        run: pnpm run format:check
