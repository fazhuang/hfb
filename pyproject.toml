[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huangfumi-platform"
version = "0.2.0"
description = "皇甫谧数字人文与中医经典智能研究平台"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "皇甫谧数字人文平台 Team", email = "dev@huangfumi.org"},
]
keywords = [
    "digital-humanities",
    "traditional-chinese-medicine",
    "knowledge-graph",
    "rag",
    "ai-native",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "httpx2>=2.9.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
    "redis>=5.2.0",
    "elasticsearch[async]>=8.17.0,<9.0.0",
    "minio>=7.2.0",
    "psycopg2-binary>=2.9.0",
    "pypdf>=5.0.0",
    "pyjwt>=2.8.0",
    "pymupdf>=1.24.0",
    "defusedxml>=0.7.1,<0.8.0",
    "numpy>=1.26.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-playwright>=0.8.0",
    "coverage[toml]>=7.6.0",
    "pre-commit>=4.0.0",
    "httpx>=0.28.0",
    "httpx2>=2.9.0",
    "aiosqlite>=0.20.0",
]
milvus = ["pymilvus>=2.4.0"]
neo4j = ["neo4j>=5.27.0"]
elasticsearch = ["elasticsearch>=8.17.0,<9.0.0"]
ai = [
    "langchain>=0.3.0",
    "llama-index>=0.12.0",
    "openai>=1.58.0",
]
all = [
    "huangfumi-platform[dev,milvus,neo4j,elasticsearch,ai]",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/backend", "packages/tcm_ontology", "packages/tcm_kg", "packages/tcm_tei", "packages/tcm_rag"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "RUF",    # Ruff-specific rules
]
ignore = [
    "RUF001", # Ambiguous unicode characters (Chinese text triggers this)
    "TCH002", # Allow typing-only imports in app code
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_return_any = true
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/apps/backend,$MYPY_CONFIG_FILE_DIR/packages"

[[tool.mypy.overrides]]
module = [
    "pymilvus.*",
    "neo4j.*",
    "elasticsearch.*",
    "langchain.*",
    "llama_index.*",
    "fitz",
    "pytesseract",
    "paddleocr",
    "rapidocr_onnxruntime",
    "pdf2image",
    "playwright.sync_api",
    "pytest_playwright",
    "defusedxml.*",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=apps/backend",
    "--cov=packages",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=70",
]
markers = [
    "unit: unit tests",
    "integration: integration tests (require services)",
    "e2e: end-to-end tests",
    "slow: tests that take >1s",
    "real_llm: tests that require a real LLM API key",
]

[tool.coverage.run]
branch = true
source = ["apps", "packages"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
fail_under = 70

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
